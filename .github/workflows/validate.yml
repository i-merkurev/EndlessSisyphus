name: Validate browser game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check public/game.js
      - name: Verify entrypoint and local assets
        run: |
          test -f public/index.html
          test -f public/style.css
          grep -q 'src="game.js"' public/index.html
          grep -q 'href="style.css"' public/index.html
