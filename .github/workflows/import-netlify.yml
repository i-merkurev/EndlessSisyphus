name: Import existing published browser game

on:
  push:
    paths:
      - '.github/workflows/import-netlify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-browser-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover original public browser files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          base="https://6a69ecc84e4d921de374d29a--endless-sisyphus-game.netlify.app"
          for file in index.html game.js style.css; do
            curl --fail --silent --show-error --location \
              --retry 3 --output "public/$file" "$base/$file"
            echo "$file $(wc -c < "public/$file") bytes"
          done
          grep -q 'id="canvas"' public/index.html
          grep -q 'const CFG' public/game.js
          grep -q 'font-family' public/style.css
          node --check public/game.js
      - name: Write Netlify configuration
        run: |
          cat > netlify.toml <<'EOF'
          [build]
            publish = "public"

          [[headers]]
            for = "/*"
            [headers.values]
              Cache-Control = "public, max-age=0, must-revalidate"
          EOF
      - name: Record source origin
        run: |
          cat > SOURCE.md <<'EOF'
          # Источник восстановленной браузерной версии

          JavaScript, CSS и HTML скачаны с опубликованного деплоя Netlify от 29 июля 2026 года:
          https://6a69ecc84e4d921de374d29a--endless-sisyphus-game.netlify.app/

          Netlify deploy: `6a69ecc84e4d921de374d29a`.

          Текущий GitHub-репозиторий содержит редактируемые статические файлы.
          Перед подключением автопубликации проверьте изменения в игре.
          EOF
      - name: Commit recovered game to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public netlify.toml SOURCE.md
          if ! git diff --cached --quiet; then
            git commit -m "Import original browser game from Netlify"
            git push
          fi
