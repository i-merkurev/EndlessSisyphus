name: Prepare portable browser source

on:
  push:
    paths:
      - '.github/workflows/portable-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Netlify HTML injection and replace hosted font files
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("public/index.html")
          text = html.read_text(encoding="utf-8")
          text, n = re.subn(r'(?m)^<!-- This site is hosted on Netlify.*?-->\n', '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not locate Netlify-injected hosting banner")
          html.write_text(text, encoding="utf-8")

          css = Path("public/style.css")
          text = css.read_text(encoding="utf-8")
          font_import = '@import url("https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@700&family=Jura:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap");\n\n'
          text, n = re.subn(r'^(?:@font-face[^\n]*\n){6}', lambda _: font_import, text, count=1)
          if n != 1:
              raise SystemExit("Could not locate original local font-face declarations")
          css.write_text(text, encoding="utf-8")
          PY
      - name: Verify against prepared portable-source snapshot
        run: |
          echo "HTML SHA $(git hash-object public/index.html)"
          echo "CSS SHA $(git hash-object public/style.css)"
          echo "Game SHA $(git hash-object public/game.js)"
          test "$(git hash-object public/game.js)" = "ac733cdcf7f6bc5e5e133312565bf44ceae61605"
          node --check public/game.js
      - name: Commit portable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/style.css
          if ! git diff --cached --quiet; then
            git commit -m "Make browser game portable: Google Fonts and clean HTML"
            git push
          fi
